<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>macrokey osd</title>
<style>
  :root {
    --accent: #7dd3fc;
    --fg: #eef1f7;
    --dim: #8f99ab;
    --line: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--fg);
    user-select: none;
    cursor: default;
  }

  /* Browser-only preview: open index.html?demo=1 for a screenshot without
     the agent. The real window stays transparent. */
  body.preview {
    background:
      radial-gradient(900px 520px at 18% -10%, rgba(45, 58, 80, 0.92) 0%, rgba(15, 18, 25, 0.98) 55%, #06070a 100%);
  }

  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #card {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 17px 20px 15px;
    border-radius: 22px;
    overflow: hidden;
    background:
      linear-gradient(155deg, #1a1d26 0%, #11131a 55%, #0b0d12 100%);
    border: 1px solid var(--line);
    box-shadow:
      0 28px 70px rgba(0, 0, 0, 0.62),
      0 2px 0 rgba(255, 255, 255, 0.04) inset;
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
    transform: translateY(14px) scale(0.975);
    transition: opacity 160ms ease, transform 200ms cubic-bezier(.2, .8, .2, 1);
  }

  #card.on {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* soft coloured light */
  .glow {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(42px);
    opacity: 0.30;
    background: var(--accent);
  }
  .glow.a { width: 280px; height: 180px; left: -90px; top: -110px; }
  .glow.b { width: 220px; height: 140px; right: -70px; bottom: -100px; opacity: 0.14; }

  /* faint dot texture */
  #card::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px);
    background-size: 16px 16px;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 72%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 72%);
  }

  #sheen {
    position: absolute;
    inset: -10%;
    pointer-events: none;
    background: linear-gradient(108deg, transparent 32%, rgba(255, 255, 255, 0.10) 46%, transparent 60%);
    transform: translateX(-130%);
  }
  #card.sweep #sheen { animation: sheen 720ms cubic-bezier(.3,.6,.3,1); }
  @keyframes sheen {
    from { transform: translateX(-130%); }
    to   { transform: translateX(130%); }
  }

  .top {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 20px;
    flex: none;
  }

  .ctx {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.35px;
    text-transform: uppercase;
    color: var(--dim);
    white-space: nowrap;
    max-width: 34%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ctx .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    flex: none;
  }

  .rail {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-left: auto;
    overflow: hidden;
  }

  .pill {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: #8d97a8;
    border: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(255, 255, 255, 0.025);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }

  .pill.active {
    color: #08141c;
    background: var(--accent);
    border-color: transparent;
    box-shadow: 0 0 18px -4px var(--accent);
    animation: pillIn 320ms cubic-bezier(.2, .9, .25, 1.3);
  }

  @keyframes pillIn {
    0% { transform: scale(0.82); }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .badge {
    flex: none;
    margin-left: 10px;
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-radius: 999px;
    padding: 2px 7px;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .badge.on { opacity: 1; }

  .mid {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    gap: 14px;
    flex: none;
    padding: 2px 0 4px;
  }

  .hero { min-width: 0; flex: 1; }

  .eyebrow {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #6f7a8c;
    margin-bottom: 2px;
  }

  .layer {
    font-size: 31px;
    line-height: 1.02;
    font-weight: 760;
    letter-spacing: -0.7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: linear-gradient(92deg, #ffffff 10%, #cfd7e5 70%, var(--accent) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .layer.swap { animation: nameIn 380ms cubic-bezier(.2, .8, .2, 1); }
  @keyframes nameIn {
    from { opacity: 0; transform: translateY(9px); letter-spacing: 2px; }
    to   { opacity: 1; transform: translateY(0); letter-spacing: -0.7px; }
  }

  .toast {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 48%;
    padding: 6px 12px 6px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.09);
    color: #e9edf5;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 140ms ease, transform 180ms cubic-bezier(.2,.8,.2,1);
  }
  .toast.show { opacity: 1; transform: translateX(0); }
  .toast .arrow { color: var(--accent); font-size: 12px; flex: none; }
  .toast span:last-child { overflow: hidden; text-overflow: ellipsis; }

  .pad {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    min-height: 0;
    padding-top: 2px;
  }

  .keys {
    display: flex;
    gap: 9px;
    flex: 1;
    min-width: 0;
    height: 100%;
  }

  .key {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    max-height: 88px;
    border-radius: 12px;
    background: linear-gradient(180deg, #262b37 0%, #191c25 62%, #14171e 100%);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow:
      0 5px 0 #0a0c10,
      0 10px 20px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    padding: 14px 10px 10px;
    transition: transform 90ms ease, box-shadow 130ms ease, border-color 130ms ease, background 130ms ease;
    overflow: hidden;
  }

  .key .num {
    position: absolute;
    top: 7px;
    left: 9px;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 8.5px;
    font-weight: 700;
    color: #6c7789;
  }

  .key .label {
    width: 100%;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1px;
    color: #dfe4ee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .key .subs {
    position: absolute;
    top: 7px;
    right: 9px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    max-width: 62%;
    pointer-events: none;
  }
  .key .subs span {
    font-size: 7.8px;
    color: #9aa4b5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .key .subs b {
    color: var(--accent);
    font-size: 7.2px;
    font-weight: 800;
    margin-right: 3px;
  }

  .key .ripple {
    position: absolute;
    inset: -1px;
    border-radius: 13px;
    border: 1px solid var(--accent);
    opacity: 0;
    pointer-events: none;
  }

  .key.hit {
    transform: translateY(5px);
    border-color: color-mix(in srgb, var(--accent) 70%, transparent);
    background: linear-gradient(180deg, #2c3444 0%, #1c2230 62%, #151922 100%);
    box-shadow:
      0 1px 0 #0a0c10,
      0 0 30px -2px var(--accent),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }
  .key.hit .ripple { animation: ripple 520ms ease-out; }
  @keyframes ripple {
    0%   { opacity: 0.65; transform: scale(0.94); }
    100% { opacity: 0;    transform: scale(1.16); }
  }

  .knobwrap {
    flex: none;
    width: 236px;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .knobwell {
    flex: none;
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.05), transparent 68%);
  }

  .knob {
    position: relative;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #3b4252 0%, #222734 45%, #14171e 75%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      0 7px 16px rgba(0, 0, 0, 0.55),
      inset 0 1px 1px rgba(255, 255, 255, 0.16),
      inset 0 -4px 8px rgba(0, 0, 0, 0.35);
    transition: transform 180ms cubic-bezier(.2,.8,.2,1), box-shadow 140ms ease;
  }

  .knob::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 7px;
    width: 3px;
    height: 15px;
    border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 9px var(--accent);
    transform: translateX(-50%);
  }

  .knob.turn-left { transform: rotate(-26deg); }
  .knob.turn-right { transform: rotate(26deg); }
  .knob.hit {
    transform: scale(0.93);
    box-shadow:
      0 0 32px -2px var(--accent),
      inset 0 1px 1px rgba(255, 255, 255, 0.16);
  }

  .knoblbls {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .kb {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 22px;
    padding: 0 8px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: #aeb7c7;
    font-size: 9.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .kb i {
    font-style: normal;
    color: #7c879a;
    font-size: 10px;
    flex: none;
  }
  .kb span { overflow: hidden; text-overflow: ellipsis; }
  .kb.press { height: 36px; }
  .kb.press.compact { height: 22px; }
  .kbtxt {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    overflow: hidden;
  }
  .kbsub {
    font-size: 7.5px;
    color: #8f99ab;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kb.hit {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--fg);
  }
  .kb.hit i { color: var(--accent); }
</style>
</head>
<body>
  <div id="stage">
    <div id="card">
      <div class="glow a"></div>
      <div class="glow b"></div>
      <div id="sheen"></div>

      <div class="top">
        <div class="ctx"><span class="dot"></span><span id="ctx">General</span></div>
        <div class="rail" id="rail"></div>
        <div class="badge" id="badge"></div>
      </div>

      <div class="mid">
        <div class="hero">
          <div class="eyebrow">Layer</div>
          <div class="layer" id="name">Media</div>
        </div>
        <div class="toast" id="toast">
          <span class="arrow">→</span><span id="action">Previous</span>
        </div>
      </div>

      <div class="pad">
        <div class="keys">
          <div class="key" data-input="k1">
            <span class="num">1</span><span class="subs" id="k1subs"></span><span class="label" id="k1">Previous</span><span class="ripple"></span>
          </div>
          <div class="key" data-input="k2">
            <span class="num">2</span><span class="subs" id="k2subs"></span><span class="label" id="k2">Play/Pause</span><span class="ripple"></span>
          </div>
          <div class="key" data-input="k3">
            <span class="num">3</span><span class="subs" id="k3subs"></span><span class="label" id="k3">Next</span><span class="ripple"></span>
          </div>
        </div>

        <div class="knobwrap">
          <div class="knobwell">
            <div class="knob" id="knob" data-input="knob_press"></div>
          </div>
          <div class="knoblbls">
            <div class="kb" data-input="knob_ccw"><i>↺</i><span id="kc">Vol −</span></div>
            <div class="kb press" data-input="knob_press">
              <i>⏺</i>
              <span class="kbtxt"><span id="kp">Mute</span><span class="kbsub" id="kpsub"></span></span>
            </div>
            <div class="kb" data-input="knob_cw"><i>↻</i><span id="kw">Vol +</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const card = $("card");
  let visible = false;

  function text(id, value) {
    $(id).textContent = value && String(value).length ? String(value) : "—";
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function restart(node, className, ms) {
    node.classList.remove(className);
    void node.offsetWidth;
    node.classList.add(className);
    if (ms) setTimeout(() => node.classList.remove(className), ms);
  }

  window.showOsd = function (p) {
    if (!p) return;
    const mode = p.mode || "layer";
    const accent = p.color || "#7dd3fc";
    document.documentElement.style.setProperty("--accent", accent);

    text("ctx", p.context);
    text("name", p.layer);

    const keys = p.keys || [];
    text("k1", keys[0]);
    text("k2", keys[1]);
    text("k3", keys[2]);
    const knob = p.knob || [];
    text("kc", knob[0]);
    text("kp", knob[1]);
    text("kw", knob[2]);

    const gestures = p.gestures || {};
    for (const id of ["k1", "k2", "k3"]) {
      const g = gestures[id] || {};
      const parts = [];
      if (g.double) parts.push(`<span><b>2×</b>${escapeHtml(g.double)}</span>`);
      if (g.hold) parts.push(`<span><b>H</b>${escapeHtml(g.hold)}</span>`);
      $(id + "subs").innerHTML = parts.join("");
    }

    const press = gestures.knob_press || {};
    const extras = [];
    if (press.double) extras.push(`2× ${press.double}`);
    if (press.hold) extras.push(`H ${press.hold}`);
    $("kpsub").textContent = extras.join(" · ");
    $("kpsub").style.display = extras.length ? "" : "none";
    document.querySelector('[data-input="knob_press"].kb')?.classList.toggle("compact", !extras.length);

    const rail = $("rail");
    rail.innerHTML = "";
    const entries = (p.rail && p.rail.length)
      ? p.rail
      : [{ id: "current", label: p.layer, active: true }];
    for (const entry of entries) {
      const pill = document.createElement("span");
      pill.className = "pill" + (entry.active ? " active" : "");
      pill.textContent = entry.label || entry.id;
      rail.appendChild(pill);
    }

    const badge = $("badge");
    const pressed = p.badge === "pressed";
    badge.textContent = pressed ? "" : (p.badge || "");
    badge.classList.toggle("on", !!p.badge && !pressed);

    const toast = $("toast");
    if (p.action) {
      text("action", p.action);
      restart(toast, "show");
    } else {
      toast.classList.remove("show");
    }

    if (!visible) {
      card.classList.add("on");
      visible = true;
    }

    if (mode !== "press") {
      restart($("name"), "swap", 420);
      restart(card, "sweep", 780);
    }

    document.querySelectorAll(".hit").forEach((el) => el.classList.remove("hit"));
    if (p.pressed) {
      document.querySelectorAll(`[data-input="${p.pressed}"]`).forEach((el) => el.classList.add("hit"));
      if (p.pressed === "knob_ccw" || p.pressed === "knob_cw") {
        const knob = $("knob");
        knob.classList.remove("turn-left", "turn-right");
        void knob.offsetWidth;
        knob.classList.add(p.pressed === "knob_ccw" ? "turn-left" : "turn-right");
        setTimeout(() => knob.classList.remove("turn-left", "turn-right"), 280);
      }
    }
  };

  window.fadeOsd = function () {
    card.classList.remove("on");
    visible = false;
  };

  // Browser-only preview used for docs and screenshots.
  if (new URLSearchParams(location.search).has("demo")) {
    document.body.classList.add("preview");
    window.showOsd({
      context: "VS Code",
      layer: "Debug",
      color: "#63b3ed",
      keys: ["Ctrl+S", "Ctrl+Shift+P", "Ctrl+`"],
      knob: ["Scroll ↓", "Build", "Scroll ↑"],
      badge: "manual",
      pressed: "k2",
      action: "Ctrl+Shift+P",
      mode: "press",
      rail: [
        { id: "edit", label: "Edit", active: false },
        { id: "nav", label: "Nav", active: false },
        { id: "debug", label: "Debug", active: true },
        { id: "build", label: "Build", active: false }
      ],
      gestures: {
        k1: { tap: "Ctrl+S", double: "Save all", hold: "" },
        k2: { tap: "Ctrl+Shift+P", double: "", hold: "" },
        k3: { tap: "Ctrl+`", double: "Nav (next key)", hold: "Nav (held)" },
        knob_ccw: { tap: "Scroll ↓", double: "", hold: "" },
        knob_press: { tap: "Build", double: "Next layer", hold: "Peek legend" },
        knob_cw: { tap: "Scroll ↑", double: "", hold: "" }
      }
    });
  }
</script>
</body>
</html>
